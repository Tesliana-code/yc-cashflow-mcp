[package]
name = "yc-cashflow-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Local read-only MCP server for public YC company profiles (yc-oss mirror)"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "y-combinator", "startups"]
categories = ["command-line-utilities"]
# Not published to crates.io. Set `repository` once the public URL exists.
publish = false
exclude = ["benchmarks/", "docs/", "scripts/", "data/"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "io-std", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["client", "transport-child-process"] }
tempfile = "3.27.0"
